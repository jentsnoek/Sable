[package]
name = "sable"
version = "0.1.0"
description = "A desktop workspace for League of Legends mod files"
authors = ["Jent"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "sable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
ltk_mod_project = { git = "https://github.com/LeagueToolkit/league-mod", rev = "69f6583480e2da7f8d6bebee22ce53dc988ebeba", features = ["modpkg", "fantome"] }
ltk_anim = "0.3.15"
ltk_hash = "0.5.4"
ltk_meta = "0.8.6"
ltk_texture = { version = "0.6.7", features = ["intel-tex"] }
ltk_wad = "0.5.9"
image = { version = "0.25.2", default-features = false, features = ["png", "dds"] }
image_dds = { version = "0.6.2", default-features = false, features = ["ddsfile", "image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
