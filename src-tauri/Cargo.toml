[package]
name = "sable"
version = "0.1.0"
description = "A desktop workspace for League of Legends mod files"
authors = ["Jent"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "sable_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]
